name: Build APK

# Otomatis saat push, atau jalankan manual dari tab Actions.
# Setiap build sukses di branch utama otomatis jadi Release baru.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk membuat Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle di-install oleh action ini, jadi kita TIDAK butuh
      # gradle-wrapper.jar di repo (file biner susah di-upload dari HP).
      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Siapkan keystore rilis
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            echo "Keystore rilis disiapkan ($(stat -c%s release.jks) byte)"
          else
            echo "::warning::KEYSTORE_BASE64 kosong - APK akan pakai debug key"
          fi

      - name: Tes unit (verifikasi format Motion Photo)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK release
        env:
          # versionCode & versionName di dalam APK ikut nomor ini,
          # jadi selalu sinkron dengan tag Release & nama file.
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Periksa tanda tangan APK
        id: sign
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | tee /tmp/sig.txt
          if grep -qi "CN=Android Debug" /tmp/sig.txt; then
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK memakai debug key: artifact tetap diunggah, tetapi Release publik dilewati."
          else
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
            echo "APK ditandatangani kunci rilis."
          fi

      - name: Siapkan berkas APK
        id: prep
        run: |
          mkdir -p out
          VER="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk \
             "out/LivePhotoMaker-${VER}.apk"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoMaker-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # ---- Release hanya dibuat untuk push ke branch utama ----
      - name: Terbitkan Release
        # Jangan pernah menerbitkan APK yang masih memakai debug key.
        if: github.event_name != 'pull_request' && steps.sign.outputs.release_signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          name: Live Photo Maker ${{ steps.prep.outputs.version }}
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## Live Photo Maker ${{ steps.prep.outputs.version }}

            Ubah video jadi **Motion Photo** — file yang muncul berlabel
            **Live** di picker galeri TikTok saat mau posting.

            ### Cara pasang
            1. Download berkas `.apk` di bagian **Assets** di bawah
            2. Buka berkasnya, izinkan **Install unknown apps** kalau diminta
            3. Buka app → Pilih Video → atur slider → **Buat Live Photo**
            4. Hasil tersimpan di `DCIM/Camera`

            ### Catatan penting
            - APK ini ditandatangani dengan **kunci rilis**. Jangan unggah ke
              Play Store tanpa menyiapkan identitas aplikasi, kebijakan, dan
              signing key milikmu sendiri.
            - Dukungan label Live **berbeda-beda tiap perangkat dan versi TikTok**.
              Paling andal di Samsung (One UI) dan Google Pixel.
            - Tes dulu di **Galeri bawaan**: kalau di sana sudah bergerak,
              berarti format file sudah benar. Kalau galeri OK tapi TikTok tidak
              mengenali, itu batasan di sisi TikTok.

            ### Privasi
            App berjalan **sepenuhnya offline**. Tidak ada izin `INTERNET`
            sama sekali, jadi tidak mungkin mengirim data ke mana pun.

            Lisensi MIT · Tanpa jaminan — lihat [TERMS.md](TERMS.md)

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f release.jks

      - name: Laporan tes kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: app/build/reports/
          if-no-files-found: ignore
