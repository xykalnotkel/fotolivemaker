name: Build APK

# Setiap push main/master yang lolos validasi langsung menjadi GitHub Release.
# Pull request hanya menjalankan tes dan build artifact, tanpa publikasi.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Push beruntun diproses bergiliran agar nomor patch otomatis tidak tabrakan.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dan riwayat tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Siapkan Android SDK 37
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/android" ]; then
            curl -fsSL -o "$RUNNER_TEMP/cmdtools.zip" \
              "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/cmdline-tools"
            mkdir -p "$RUNNER_TEMP/cmdline-tools"
            unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/android" --no-metrics sdk install \
            "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;27.0.12077973"

      - name: Siapkan keystore rilis
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            echo "Keystore rilis disiapkan ($(stat -c%s release.jks) byte)"
          else
            echo "::warning::KEYSTORE_BASE64 kosong - APK akan pakai debug key"
          fi

      - name: Tentukan nomor versi
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAME="0.0.${{ github.run_number }}-pr"
          else
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            BASE="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              MAJOR=1
              MINOR=3
              PATCH=0
            fi
            NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Versi: ${NAME}"

      - name: Tes unit (verifikasi format Motion Photo)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK release
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Periksa tanda tangan APK
        id: sign
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | tee /tmp/sig.txt
          if grep -qi "CN=Android Debug" /tmp/sig.txt; then
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APK memakai debug key: artifact tetap diunggah, tetapi Release publik dilewati."
          else
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
            echo "APK ditandatangani kunci rilis."
          fi

      - name: Siapkan APK dan catatan rilis
        id: prep
        shell: bash
        run: |
          mkdir -p out
          VER="v${{ steps.ver.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "out/FotoLive-${VER}.apk"

          awk '
            /^## Unreleased/ { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/unreleased.md"

          cat > out/RELEASE_NOTES.md <<EOF
          # Foto Live ${VER}

          Ubah video menjadi Motion Photo portrait dengan timeline editor.

          ## Cara memasang

          1. Unduh berkas APK pada bagian Assets.
          2. Buka APK dan izinkan Install unknown apps bila diminta.
          3. Buka Foto Live, pilih video, atur timeline, lalu tekan Export.

          ## Changelog

          EOF
          if [ -s "$RUNNER_TEMP/unreleased.md" ]; then
            cat "$RUNNER_TEMP/unreleased.md" >> out/RELEASE_NOTES.md
          else
            echo "- Build otomatis dari commit ${GITHUB_SHA}." >> out/RELEASE_NOTES.md
          fi
          cat >> out/RELEASE_NOTES.md <<EOF

          ## Kompatibilitas

          - Android 7 sampai Android 17.
          - Output default portrait 9:16.
          - Google Motion Photo dan Samsung SEF.
          - Video diproses lokal di perangkat.

          Lisensi Apache 2.0. Lihat TERMS.md dan PRIVACY.md untuk detail.
          EOF

          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoLive-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Terbitkan GitHub Release
        if: >
          steps.sign.outputs.release_signed == 'true' &&
          github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Foto Live ${{ steps.prep.outputs.version }}
          files: |
            out/*.apk
            CHANGELOG.md
          body_path: out/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f release.jks

      - name: Laporan tes kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: app/build/reports/
          if-no-files-found: ignore
